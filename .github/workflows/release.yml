# Builds the app when a release is published and attaches it to the release:
# Linux as an AppImage, Windows as an .exe, macOS as an app bundle (zipped).
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # small downloads: no debug line tables (a panic message still names the file and line)
  CARGO_PROFILE_RELEASE_DEBUG: "false"
  CARGO_PROFILE_RELEASE_STRIP: debuginfo
  TAG: ${{ github.event.release.tag_name }}

defaults:
  run:
    shell: bash

jobs:
  linux:
    # the AppImage runs where glibc is as new as this runner's (2.39) or newer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - name: AppImage
        run: |
          mkdir -p AppDir/usr/bin
          cp target/release/mod-helper AppDir/usr/bin/
          ln -s usr/bin/mod-helper AppDir/AppRun
          cp packaging/mod-helper.svg AppDir/
          cat > AppDir/mod-helper.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Mod Helper
          Comment=Map and content editor for Hearts of Iron IV mods
          Exec=mod-helper
          Icon=mod-helper
          Categories=Development;
          Terminal=false
          EOF
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir "mod-helper-$TAG-linux-x86_64.AppImage"
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "mod-helper-$TAG-linux-x86_64.AppImage" --clobber

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp target/release/mod-helper.exe "mod-helper-$TAG-windows-x86_64.exe"
          gh release upload "$TAG" "mod-helper-$TAG-windows-x86_64.exe" --clobber

  macos:
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
      - name: App bundle
        run: |
          app="Mod Helper.app"
          mkdir -p "$app/Contents/MacOS"
          # one binary for Apple silicon and Intel Macs
          lipo -create -output "$app/Contents/MacOS/mod-helper" target/aarch64-apple-darwin/release/mod-helper target/x86_64-apple-darwin/release/mod-helper
          cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Mod Helper</string>
            <key>CFBundleDisplayName</key><string>Mod Helper</string>
            <key>CFBundleIdentifier</key><string>io.github.eliavandini.mod-helper</string>
            <key>CFBundleExecutable</key><string>mod-helper</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${TAG#v}</string>
            <key>CFBundleVersion</key><string>${TAG#v}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF
          # not notarized: an ad-hoc signature, so macOS offers "Open Anyway"
          codesign --force --deep --sign - "$app"
          ditto -c -k --keepParent "$app" "mod-helper-$TAG-macos.zip"
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "mod-helper-$TAG-macos.zip" --clobber
