[package]
name = "mod-helper"
version = "0.1.0"
edition = "2024"
description = "Map editing helper tools for a HOI4 total conversion centred on Tyrol and Trentino"

[dependencies]
anyhow = "1.0"
crossbeam-channel = "0.5"
eframe = { version = "0.37", features = ["persistence"] }
env_logger = "0.11"
flate2 = "1.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
log = "0.4"
osmpbf = "0.3"
parking_lot = "0.13"
postcard = { version = "1.1", features = ["use-std"] }
rayon = "1.12"
regex = "1.11"
rfd = "0.17"
rustc-hash = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tiff = "0.11"
unicode-normalization = "0.1"
weezl = "0.1"

[profile.dev]
opt-level = 1

# Decoding big rasters / PBF files is unbearably slow without optimisations.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
debug = "line-tables-only"
